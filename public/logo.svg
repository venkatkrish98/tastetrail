<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <!-- Outer Compass Ring Subtle Arc -->
  <circle cx="24" cy="24" r="21" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4" stroke-opacity="0.4" />
  
  <!-- Waypoint Route Curve -->
  <path d="M12 34 C12 26, 20 22, 24 16 C28 22, 36 26, 36 34 C36 40, 30 42, 24 42 C18 42, 12 40, 12 34 Z" 
        fill="url(#waypointGradient)" />
  
  <!-- Cultural Discovery Eye / Lens -->
  <path d="M10 24 C16 16, 32 16, 38 24 C32 32, 16 32, 10 24 Z" 
        stroke="url(#lensGradient)" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Central Cultural Convergence Star / Waypoint Beacon -->
  <circle cx="24" cy="24" r="4.5" fill="#f59e0b" />
  <circle cx="24" cy="24" r="2" fill="#ffffff" />
  
  <!-- Cardinal Discovery Points -->
  <circle cx="24" cy="6" r="1.75" fill="#38bdf8" />
  <circle cx="42" cy="24" r="1.75" fill="#818cf8" />
  <circle cx="6" cy="24" r="1.75" fill="#818cf8" />
  <circle cx="24" cy="42" r="1.75" fill="#38bdf8" />

  <defs>
    <linearGradient id="waypointGradient" x1="12" y1="16" x2="36" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="lensGradient" x1="10" y1="24" x2="38" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>
</svg>
